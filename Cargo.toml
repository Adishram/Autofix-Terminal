[package]
name = "autofix"
version = "0.1.1"
edition = "2021"
description = "Auto-fixing developer tool — intercepts failing commands and uses AI to fix the code"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dialoguer = "0.11"
console = "0.15"
similar = "2"
regex = "1"
ctrlc = "3.5.2"

[profile.release]
opt-level = 3
lto = true
