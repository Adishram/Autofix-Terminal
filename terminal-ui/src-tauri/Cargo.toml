[package]
name = "terminal-ui"
version = "0.1.1"
description = "AutoFix Terminal — A native terminal emulator with AI-powered auto-fix"
authors = ["you"]
edition = "2021"

[lib]
name = "terminal_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-pty = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
